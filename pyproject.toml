[project]
name = "yamlgotcha"
version = "0.1.0"
description = "Scan YAML config files for classic parsing footguns"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
yamlgotcha = "yamlgotcha.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
